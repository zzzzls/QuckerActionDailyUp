name: QuickerActionsDailyCrawler
on:
  schedule:
    # Cron is UTC: 08:00 and 21:00 Asia/Shanghai (runs may be delayed).
    - cron: '0 0,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quicker-archives-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  task:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        # Resolve the latest branch after waiting for any earlier writer.
        ref: ${{ github.ref_name }}

    - name: init python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
    - run: pip install -r requirements.txt

    - name: Regression tests
      run: python -m unittest discover -s tests -v

    - name: run script
      id: crawl
      run: python scripts/crawler.py

    - name: Commit changes
      uses: EndBug/add-and-commit@v9
      with:
        default_author: github_actions
        add: 'data/csv data/html'
        message: ${{ steps.crawl.outputs.message }}
